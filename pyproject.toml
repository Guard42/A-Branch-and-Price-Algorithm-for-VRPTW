[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpvrptw"
version = "0.2.0"
description = "Branch-and-Price exact solver for VRPTW (educational)"
readme = "README.md"
authors = [{ name = "Junwei Li" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["vehicle-routing", "vrptw", "branch-and-price", "column-generation", "or-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
[project.urls]
Homepage = "https://github.com/Guard42/A-Branch-and-Price-Algorithm-for-VRPTW"
Bug-Tracker = "https://github.com/Guard42/A-Branch-and-Price-Algorithm-for-VRPTW/issues"
dependencies = [
    "numpy>=1.24",
    "highspy>=1.7",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
bpvrptw = "bpvrptw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bpvrptw"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
