[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpvrptw"
version = "0.1.0"
description = "Branch-and-Price exact solver for VRPTW (educational)"
authors = [{ name = "Junwei Li" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "highspy>=1.7",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
bpvrptw = "bpvrptw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bpvrptw"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]


[tool.pytest.ini_options]
testpaths = ["tests"]
