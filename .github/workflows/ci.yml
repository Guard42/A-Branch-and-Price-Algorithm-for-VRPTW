name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest -q
      - name: Types (mypy)
        run: python -m mypy bpvrptw
      - name: Docs links
        run: python scripts/check_docs_links.py

  smoke:
    # End-to-end solve on a tiny instance with the license-free HiGHS path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot]"
      - name: Solve C101_25 end to end
        run: |
          mkdir -p artifacts
          python -m bpvrptw solve dataset/C101_25.txt --time-limit 120 \
            --output-json artifacts/c10125_smoke.json --quiet
      - name: Assert optimal certificate
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("artifacts/c10125_smoke.json"))
          assert d["status"] == "SOLVED_OPTIMAL", d["status"]
          assert abs(d["total_cost"] - 191.7) < 0.5, d["total_cost"]
          print("smoke OK:", d["total_cost"])
          EOF
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: c10125-smoke
          path: artifacts/c10125_smoke.json

  cpp:
    # Build the C++ implementation and reproduce known optima.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --config Release --parallel
      - name: Reproduce known optima
        run: ctest --test-dir cpp/build --output-on-failure
